[project]
name = "data-engineer-course"
version = "0.1.0"
description = "Kurs Junior Data Engineer - repozytorium nauki"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
